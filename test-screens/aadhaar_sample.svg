<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9933"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="380" rx="14" fill="#ffffff" stroke="#c7cdd6" stroke-width="2"/>
  <rect x="0" y="0" width="640" height="10" fill="url(#stripe)"/>

  <!-- Header -->
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700">SAMPLE / GOVERNMENT OF INDIA (FICTIONAL)</text>
  <text x="24" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#555">Unique Identification Authority of India — Demo Data Only</text>
  <circle cx="600" cy="40" r="20" fill="#f4813f"/>
  <text x="600" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">AADHAAR</text>

  <line x1="24" y1="70" x2="616" y2="70" stroke="#e2e5ea" stroke-width="1"/>

  <!-- Avatar placeholder (generic silhouette, not a real photo) -->
  <rect x="24" y="90" width="120" height="150" rx="8" fill="#eef1f6" stroke="#d9dee7"/>
  <circle cx="84" cy="145" r="26" fill="#b8c0cc"/>
  <path d="M40 220 Q84 170 128 220 L128 232 L40 232 Z" fill="#b8c0cc"/>

  <!-- Details -->
  <text x="164" y="105" font-family="system-ui, sans-serif" font-size="18" fill="#111" font-weight="700">Rahul Kumar Sharma</text>
  <text x="164" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#333">DOB: 15/08/1998</text>
  <text x="164" y="150" font-family="system-ui, sans-serif" font-size="13" fill="#333">Gender: Male</text>

  <text x="164" y="185" font-family="system-ui, sans-serif" font-size="12" fill="#555">Address (fictional):</text>
  <text x="164" y="203" font-family="system-ui, sans-serif" font-size="12" fill="#333">12, Sample Nagar, Near Test Chowk,</text>
  <text x="164" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#333">Anytown, Demo State - 000000</text>

  <!-- Aadhaar number -->
  <text x="24" y="270" font-family="system-ui, sans-serif" font-size="26" fill="#111" font-weight="700" letter-spacing="3">0000 0000 0000</text>
  <text x="24" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#777">VID: 0000 0000 0000 0000 (sample, not valid)</text>

  <!-- fake QR block -->
  <rect x="500" y="150" width="110" height="110" fill="#f2f4f7" stroke="#d9dee7"/>
  <text x="555" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#9aa2af" text-anchor="middle">QR</text>
  <text x="555" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#9aa2af" text-anchor="middle">(placeholder)</text>

  <line x1="0" y1="330" x2="640" y2="330" stroke="#e2380b" stroke-width="3"/>
  <text x="320" y="358" font-family="system-ui, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="600">This is a fictional sample for UI testing — not a real Aadhaar card</text>

  <!-- Watermark -->
  <text x="320" y="210" font-family="system-ui, sans-serif" font-size="60" fill="#e2380b" fill-opacity="0.12" text-anchor="middle" font-weight="800" transform="rotate(-18 320 210)">SAMPLE</text>
</svg>
