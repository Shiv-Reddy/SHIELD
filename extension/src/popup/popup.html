<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shield</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <!--
      Brand and current state share one row. They were two stacked blocks, which
      spent a third of a 320px popup restating that this is Shield. The state is
      the only thing here that changes during a run, so it gets the position the
      eye returns to.
    -->
    <header class="header">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="brand-name">Shield</h1>
      <span class="status" aria-live="polite">
        <span id="status-dot" class="status-dot" data-status="idle" aria-hidden="true"></span>
        <span id="status-label" class="status-label">Idle</span>
      </span>
    </header>

    <p id="status-detail" class="notice notice-error" hidden></p>
    <!-- FR-27: a fallback to CPU must be visible, not a silent slowdown. -->
    <p id="backend-notice" class="notice" hidden></p>

    <form id="task-form" class="task-form">
      <input
        id="task-input"
        class="task-input"
        type="text"
        name="task"
        placeholder="Log me in"
        aria-label="What should Shield do?"
        autocomplete="off"
        required
      />
      <div class="actions">
        <button id="run-button" class="button button-primary" type="submit">Run</button>
        <button id="cancel-button" class="button" type="button" hidden>Cancel</button>
      </div>

      <!--
        Manual redaction. The rules will always miss something on a page nobody
        wrote for us; the person looking at the screen is the one who knows.

        Marking is a step before a run, not a setting on one, so it sits apart
        from the Run row rather than beside it as an equal-weight button.
      -->
      <div class="manual">
        <button id="manual-button" class="button button-quiet" type="button">
          Hide an area on this page
        </button>
        <p class="manual-state" hidden id="manual-state">
          <span id="manual-count"></span>
          <button id="manual-clear" class="linkish" type="button">Clear</button>
        </p>
      </div>

      <!--
        Shield acts on the page. That is the point of it, and it is also why
        running it against a live third-party site needs a way to watch without
        touching: on an autofilled login it would click "Sign in", and on a
        part-filled sign-up it would tick the consent box and submit.

        Everything still runs — detection, redaction, the seal, the request —
        so the run is a real measurement. Only the last step is withheld.
      -->
      <label class="observe">
        <input id="observe-only" type="checkbox" />
        <span>Observe only — run everything, but don't touch the page</span>
      </label>
    </form>

    <!--
      Two disclosures, same shape, one after the other.

      Where the time went, measured rather than estimated, against the
      ARCHITECTURE.md Section 6 budget; and the outgoing payload itself
      (DEMO_SCRIPT.md step 5), because every other guarantee in this project is
      an assurance about code the reader has not read. This is the bytes.
    -->
    <section class="panels">
      <div class="panel">
        <button id="latency-toggle" class="panel-toggle" type="button" aria-expanded="false" hidden>
          Where did the time go?
        </button>
        <div id="latency-body" class="panel-body" hidden>
          <ul id="latency-list" class="latency-list"></ul>
          <p id="latency-total" class="latency-total"></p>
        </div>
      </div>

      <div class="panel">
        <button id="evidence-toggle" class="panel-toggle" type="button" aria-expanded="false">
          What was sent?
        </button>
        <div id="evidence-body" class="panel-body" hidden>
          <p id="evidence-meta" class="evidence-meta"></p>
          <pre id="evidence-json" class="evidence-json"></pre>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Sensitive data is hidden on this device before anything is sent.</p>
      <!--
        The running build, shown in the UI rather than only in a console.
        A service worker inspector silently detaches when the extension
        reloads and will happily replay stale logs forever; the popup is
        rebuilt from the current bundle every time it opens, so it cannot
        lie about which build it is.
      -->
      <p id="build-info" class="build-info"></p>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
