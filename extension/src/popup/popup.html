<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shield</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 class="brand-name">Shield</h1>
      </div>
      <p class="tagline">Your screen stays yours.</p>
    </header>

    <section class="status" aria-live="polite">
      <span id="status-dot" class="status-dot" data-status="idle" aria-hidden="true"></span>
      <span id="status-label" class="status-label">Idle</span>
    </section>

    <p id="status-detail" class="status-detail" hidden></p>
    <!-- FR-27: a fallback to CPU must be visible, not a silent slowdown. -->
    <p id="backend-notice" class="backend-notice" hidden></p>

    <form id="task-form" class="task-form">
      <label class="field-label" for="task-input">What should Shield do?</label>
      <input
        id="task-input"
        class="task-input"
        type="text"
        name="task"
        placeholder="Log me in"
        autocomplete="off"
        required
      />
      <div class="actions">
        <button id="run-button" class="button button-primary" type="submit">Run</button>
        <button id="cancel-button" class="button" type="button" hidden>Cancel</button>
      </div>
    </form>

    <!--
      Where the time went, measured rather than estimated.
      Every stage is already timed against the ARCHITECTURE.md Section 6 budget;
      this shows the numbers instead of leaving them in a console. It answers
      the obvious question about an on-device privacy layer — what does it cost?
      — with the run the judge just watched.
    -->
    <section class="latency">
      <button id="latency-toggle" class="evidence-toggle" type="button" aria-expanded="false" hidden>
        Where did the time go?
      </button>
      <div id="latency-body" class="latency-body" hidden>
        <ul id="latency-list" class="latency-list"></ul>
        <p id="latency-total" class="latency-total"></p>
      </div>
    </section>

    <!--
      The outgoing payload, shown in the extension itself.
      DEMO_SCRIPT.md step 5: every other guarantee in this project is an
      assurance about code the reader has not read. This is the bytes.
    -->
    <section class="evidence">
      <button id="evidence-toggle" class="evidence-toggle" type="button" aria-expanded="false">
        What was sent?
      </button>
      <div id="evidence-body" class="evidence-body" hidden>
        <p id="evidence-meta" class="evidence-meta"></p>
        <pre id="evidence-json" class="evidence-json"></pre>
      </div>
    </section>

    <footer class="footer">
      <p>Sensitive data is hidden on this device before anything is sent.</p>
      <!--
        The running build, shown in the UI rather than only in a console.
        A service worker inspector silently detaches when the extension
        reloads and will happily replay stale logs forever; the popup is
        rebuilt from the current bundle every time it opens, so it cannot
        lie about which build it is.
      -->
      <p id="build-info" class="build-info"></p>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
