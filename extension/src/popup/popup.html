<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shield</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <!--
      HEADER
      The mark, the name, and the one thing on this surface that changes during
      a run. Status sits far right because that is where the eye returns to
      while waiting; everything else here is constant and can be read once.
    -->
    <header class="header">
      <span class="brand">
<svg class="brand-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 725 725" fill="currentColor">
        <clipPath id="sh"><rect x="0" y="0" width="347.5" height="725"/></clipPath>
        <path d="M347.5 0C245 28 128 92 47.5 163C47.5 380 140 600 347.5 725ZM100 352C165 245 258 232 347.5 232C347.5 232 347.5 472 347.5 472C258 472 165 459 100 352ZM363 352C363 390.659932486 331.659932486 422 293 422C254.340067514 422 223 390.659932486 223 352C223 313.340067514 254.340067514 282 293 282C331.659932486 282 363 313.340067514 363 352ZM349 352C349 362.4934102462 340.4934102462 371 330 371C319.5065897538 371 311 362.4934102462 311 352C311 341.5065897538 319.5065897538 333 330 333C340.4934102462 333 349 341.5065897538 349 352Z" fill-rule="evenodd" clip-path="url(#sh)"/>
        <rect x="352" y="214" width="40" height="40"/><rect x="352" y="297" width="36" height="36"/><rect x="352" y="372" width="36" height="36"/><rect x="352" y="449" width="40" height="40"/><rect x="398" y="258" width="46" height="46"/><rect x="400" y="340" width="28" height="28"/><rect x="398" y="398" width="44" height="44"/><rect x="452" y="166" width="50" height="50"/><rect x="455" y="320" width="30" height="30"/><rect x="452" y="440" width="48" height="48"/><rect x="505" y="96" width="34" height="34"/><rect x="512" y="250" width="56" height="56"/><rect x="515" y="355" width="36" height="36"/><rect x="500" y="512" width="50" height="50"/><rect x="568" y="158" width="46" height="46"/><rect x="566" y="310" width="50" height="50"/><rect x="560" y="440" width="40" height="40"/><rect x="530" y="592" width="36" height="36"/><rect x="636" y="232" width="28" height="28"/><rect x="640" y="366" width="34" height="34"/><rect x="620" y="536" width="28" height="28"/><rect x="478" y="610" width="24" height="24"/>
        </svg>
        <span class="brand-name">Shield</span>
      </span>

      <span class="status" aria-live="polite">
        <span id="status-dot" class="status-dot" data-status="idle" aria-hidden="true"></span>
        <span id="status-label" class="status-label">Idle</span>
      </span>
    </header>

    <!--
      A run has no determinate progress — the stages vary by page — so this is
      an indeterminate bar rather than a percentage that would be invented.
      It exists because the status word alone cannot distinguish "working" from
      "stalled" at a glance.
    -->
    <div id="progress" class="progress" hidden aria-hidden="true"><span></span></div>

    <main class="body">
      <p id="status-detail" class="notice notice-error" hidden></p>
      <!-- FR-27: a fallback to CPU must be visible, not a silent slowdown. -->
      <p id="backend-notice" class="notice" hidden></p>

      <form id="task-form" class="task-form">
        <label class="micro-label" for="task-input">Task</label>
        <input
          id="task-input"
          class="input"
          type="text"
          name="task"
          placeholder="Log me in"
          autocomplete="off"
          required
        />

        <div class="actions">
          <button id="run-button" class="btn btn-primary" type="submit">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 2.5 16 5v4.8c0 3.4-2.3 6.4-6 7.7-3.7-1.3-6-4.3-6-7.7V5l6-2.5Z"/>
              <path class="tick" d="M7.3 10.1 9.2 12l3.5-3.7"/>
            </svg>
            <span id="run-label">Run Shield</span>
          </button>
          <button id="cancel-button" class="btn btn-ghost btn-cancel" type="button" hidden>
            Cancel
          </button>
        </div>

        <!--
          MANUAL MARKING
          A step taken before a run, not a setting on one, so it reads as its own
          card rather than a button competing with the CTA above.
        -->
        <div class="card card-action">
          <button id="manual-button" class="row row-button" type="button">
            <svg class="icon icon-muted" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 6.5v-2a1.5 1.5 0 0 1 1.5-1.5h2M13.5 3h2A1.5 1.5 0 0 1 17 4.5v2M17 13.5v2a1.5 1.5 0 0 1-1.5 1.5h-2M6.5 17h-2A1.5 1.5 0 0 1 3 15.5v-2"/>
            </svg>
            <span class="row-text">
              <span class="row-title">Hide an area</span>
              <span class="row-sub">Draw over anything the rules missed</span>
            </span>
          </button>

          <p class="marked" hidden id="manual-state">
            <span class="marked-dot" aria-hidden="true"></span>
            <span id="manual-count"></span>
            <button id="manual-clear" class="linkish" type="button">Clear</button>
          </p>
        </div>

        <!--
          OBSERVE ONLY
          Shield acts on the page — that is the point of it, and also why running
          it against a live third-party site needs a way to watch without
          touching. Everything still runs, so the measurement is real. Only the
          last step is withheld.
        -->
        <div class="card">
          <label class="row row-toggle">
            <span class="row-text">
              <span class="row-title">Observe only</span>
              <span class="row-sub">Run everything, but don&rsquo;t touch the page</span>
            </span>
            <input id="observe-only" type="checkbox" class="switch-input" />
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>

        <!--
          DISCLOSURES
          Where the time went, measured against the ARCHITECTURE.md Section 6
          budget; and the outgoing payload itself, because every other guarantee
          in this project is an assurance about code the reader has not read.
          This is the bytes.
        -->
        <div class="panels">
          <div class="panel">
            <button id="latency-toggle" class="panel-toggle" type="button" aria-expanded="false" hidden>
              <span id="latency-toggle-label">Where did the time go?</span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
                <path d="m7.5 4.5 6 5.5-6 5.5"/>
              </svg>
            </button>
            <div id="latency-body" class="panel-body" hidden>
              <ul id="latency-list" class="latency-list"></ul>
              <p id="latency-total" class="latency-total"></p>
            </div>
          </div>

          <div class="panel">
            <button id="evidence-toggle" class="panel-toggle" type="button" aria-expanded="false">
              <span id="evidence-toggle-label">What was sent?</span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
                <path d="m7.5 4.5 6 5.5-6 5.5"/>
              </svg>
            </button>
            <div id="evidence-body" class="panel-body" hidden>
              <p id="evidence-meta" class="evidence-meta"></p>
              <pre id="evidence-json" class="evidence-json"></pre>
            </div>
          </div>
        </div>
      </form>
    </main>

    <footer class="footer">
      <p class="promise">
        <svg class="icon icon-accent" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 8.5V6a4 4 0 0 1 8 0v2.5"/>
          <rect x="4" y="8.5" width="12" height="8.5" rx="2"/>
        </svg>
        Sensitive data is hidden on this device before anything is sent.
      </p>
      <!--
        The running build, shown in the UI rather than only in a console. A
        service worker inspector silently detaches when the extension reloads
        and will happily replay stale logs forever; the popup is rebuilt from
        the current bundle every time it opens, so it cannot lie about which
        build it is. Clicking it cycles the backend override.
      -->
      <p id="build-info" class="build-info"></p>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
